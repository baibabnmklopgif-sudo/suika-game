name: Build Android APK (ARM64)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

# 不需要仓库写入权限；APK 以 Actions Artifact 形式保存。
permissions:
  contents: read

jobs:
  build-apk:
    name: Android WebView APK · arm64-v8a
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35 build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Build release APK (unsigned)
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: suika-game-arm64-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: suika-game-arm64-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
