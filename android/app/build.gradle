plugins { id 'com.android.application' }

android {
    namespace 'com.baibabnmklopgif.suika'
    compileSdk 35

    defaultConfig {
        applicationId 'com.baibabnmklopgif.suika'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.0.2'
        // 本项目没有 JNI/.so 库。声明 arm64-v8a 以便未来添加原生能力时保持 ABI 策略。
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
